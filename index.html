<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pharmacy Billing</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F0;--card:#fff;--ink:#15231D;--mut:#5E6D65;--line:#D8DED7;--acc:#0E6B50;--aci:#fff;--warn:#A8610A;--bad:#B3261E;--soft:#E4EFE9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101713;--card:#18221C;--ink:#E6EEE8;--mut:#93A39A;--line:#2A372F;--acc:#3FBF93;--aci:#07140E;--warn:#E3A650;--bad:#F08A80;--soft:#1F2D25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101713;--card:#18221C;--ink:#E6EEE8;--mut:#93A39A;--line:#2A372F;--acc:#3FBF93;--aci:#07140E;--warn:#E3A650;--bad:#F08A80;--soft:#1F2D25;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:14px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:600}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
nav button{border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:7px;font:inherit;font-weight:500;cursor:pointer}
nav button.on{background:var(--acc);color:var(--aci)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:860px){.g2{grid-template-columns:1.1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
.btn.p{background:var(--acc);color:var(--aci);border-color:var(--acc)}
.btn.s{padding:4px 9px;font-size:13px}.btn.d{color:var(--bad)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--mut);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td input{padding:5px 6px;width:70px}
.res{max-height:300px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:8px}
.it{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.it:hover{background:var(--soft)}.it:last-child{border:0}
.sm{font-size:13px;color:var(--mut)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:20px;background:var(--soft);color:var(--acc)}
.tag.w{color:var(--warn)}.tag.b{color:var(--bad)}
.big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;padding:3px 0}
.tot.f{font-size:20px;font-weight:600;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mut)}
.bar i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.empty{padding:18px;text-align:center;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
textarea{width:100%;min-height:90px;font:12px 'IBM Plex Mono',monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px}
#rcpt{display:none;font:12px/1.35 'IBM Plex Mono',ui-monospace,monospace;padding:2mm;color:#000;background:#fff}
#rcpt table{width:100%}#rcpt th,#rcpt td{border:0;padding:1px 0;color:#000;font-size:12px}#rcpt hr{border:0;border-top:1px dashed #000;margin:5px 0}
#rcpt .c{text-align:center}#rcpt .r{text-align:right}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{display:block!important}html,body{background:#fff!important}:root{padding:0}}
</style></head>
<body>
<div class="wrap" id="app"></div>
<div id="rcpt"></div><div id="toast"></div><style id="pg"></style>
<script>
const K='pharmacy-pos-v1';
const seed=()=>({seq:1,items:[
{id:'a1',name:'Paracetamol 500 mg (strip of 10)',batch:'PC2301',exp:'2027-08',qty:120,price:22,gst:12,low:20},
{id:'a2',name:'Azithromycin 500 mg (strip of 3)',batch:'AZ8812',exp:'2027-03',qty:40,price:118,gst:12,low:10},
{id:'a3',name:'ORS sachet',batch:'OR1102',exp:'2026-12',qty:8,price:21,gst:5,low:15,form:'Sachet'}],
sales:[],users:[],purch:[],rets:[],adj:[],cfg:{name:'My Pharmacy',addr:'',phone:'',gst:'',dl:'',cur:'₹',paper:80,foot:'Get well soon!',store:'device',gcid:''}});
function load(){let d;try{const r=localStorage.getItem(K);if(r)d=JSON.parse(r)}catch(e){}d=d||seed();d.users=d.users||[];d.purch=d.purch||[];d.rets=d.rets||[];d.adj=d.adj||[];d.cfg.store=d.cfg.store||'device';return d}
let db=load(),me=null,pl=[],pd={s:'',i:'',d:today()},rq='',cph='',cq='',rcNew='',tab='bill',cart=[],q='',dpct=0,cust='',pay='Cash',iq='',editId=null,sdate=today(),lastBackup='',xc=[],lossId=null;
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Could not save in this browser')}cloudQ()}
function today(){return new Date().toLocaleDateString('en-CA')}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>db.cfg.cur+(+n).toFixed(2);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
const ym=()=>today().slice(0,7);
function status(it){if(it.exp<ym())return['Expired','b'];const a=new Date(it.exp+'-01'),n=new Date(ym()+'-01');if((a-n)/2.6e9<=2)return['Expiring soon','w'];if(it.qty<=0&&!(it.loose>0))return['Out of stock','b'];if(it.qty<=it.low)return['Low stock','w'];return['OK','']}
const fe=e=>e.slice(5)+'/'+e.slice(0,4);
function render(){
if(db.users.length&&!me){$('#app').innerHTML=vLogin();return}const own=!db.users.length||me.role=='owner';const tabs=[['bill','Billing'],['ret','Returns'],['inv','Inventory']].concat(own?[['buy','Purchases'],['rep','Reports'],['cus','Customers'],['sales','Sales'],['set','Settings']]:[]);if(!tabs.some(t=>t[0]==tab))tab='bill';
$('#app').innerHTML=`<header><h1>${esc(db.cfg.name)}</h1><nav>${tabs.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav>${me?`<span class="sm">${esc(me.name)} <button class="btn s" onclick="me=null;cart=[];xc=[];render()">Log out</button></span>`:''}</header>`+({bill:vBill,ret:vRet,inv:vInv,buy:vBuy,rep:vRep,cus:vCus,sales:vSales,set:vSet}[tab])();
}
function go(t){tab=t;render()}
/* ---------- Billing ---------- */
function totals(){let g=0,tax=0;cart.forEach(c=>{const it=db.items.find(i=>i.id==c.id);if(!it)return;const l=la(c,it);g+=l;tax+=l*(1-dpct/100)*it.gst/(100+it.gst)});const d=g*dpct/100,x=xc.reduce((a,c)=>a+c.a,0);return{g,d,x,tax,t:Math.round((g-d+x)*100)/100}}
function vBill(){
const T=totals();
return `<div class="grid g2"><div class="card"><h2>Find medicine</h2>
<input id="q" placeholder="Scan a barcode or type a name, then press Enter" value="${esc(q)}" oninput="q=this.value;res()" onkeydown="if(event.key=='Enter')addFirst()" autocomplete="off">
<div class="res" id="res">${resHTML()}</div></div>
<div class="card"><h2>Current bill</h2><div class="tw">${cart.length?`<table><tr><th>Item</th><th>Qty</th><th class="n">Rate</th><th class="n">Amount</th><th></th></tr>${cart.map((c,i)=>{const it=db.items.find(x=>x.id==c.id);return `<tr><td>${esc(it.name)}<div class="sm">Stock ${stk(it)}</div></td><td><input type="number" min="1" value="${c.qty}" onchange="setQty(${i},this.value)">${(it.per||1)>1?`<select onchange="setUnit(${i},this.value)" style="width:auto;margin-top:4px"><option value="s" ${c.u!='t'?'selected':''}>${fm(it).pp}</option><option value="t" ${c.u=='t'?'selected':''}>${fm(it).us}</option></select>`:''}</td><td class="n">${m(lp(c,it))}</td><td class="n">${m(la(c,it))}</td><td><button class="btn s d" onclick="cart.splice(${i},1);render()" aria-label="Remove">Remove</button></td></tr>`}).join('')}</table>`:'<div class="empty">No items yet. Search and tap a medicine to add it.</div>'}</div>
<div class="row" style="margin-top:12px"><div><label>Customer (optional)</label><input list="cl" value="${esc(cust)}" oninput="cust=this.value;fillPh()"><datalist id="cl">${custs().map(c=>`<option value="${esc(c.n)}">`).join('')}</datalist></div><div><label>Phone (optional)</label><input id="cph" value="${esc(cph)}" oninput="cph=this.value"></div><div><label>Discount %</label><input type="number" min="0" max="100" value="${dpct}" onchange="dpct=Math.min(100,Math.max(0,+this.value||0));render()"></div><div><label>Payment</label><select onchange="pay=this.value">${['Cash','UPI','Card'].map(p=>`<option ${p==pay?'selected':''}>${p}</option>`).join('')}</select></div></div>
<div class="row" style="align-items:end"><div><label>Additional charge (optional)</label><input id="x_l" list="xl" placeholder="e.g. Delivery"><datalist id="xl"><option value="Delivery"><option value="Packing"><option value="Service charge"></datalist></div><div><label>Amount</label><input id="x_a" type="number" min="0" step="0.01" onkeydown="if(event.key=='Enter')addX()"></div><div><button class="btn" onclick="addX()">Add charge</button></div></div>
<div class="tot"><span>Subtotal</span><span>${m(T.g)}</span></div><div class="tot"><span>Discount</span><span>− ${m(T.d)}</span></div>${xc.map((c,i)=>`<div class="tot"><span>${esc(c.l)} <button class="btn s d" onclick="xc.splice(${i},1);render()" aria-label="Remove charge">×</button></span><span>+ ${m(c.a)}</span></div>`).join('')}<div class="tot sm"><span>GST included in price</span><span>${m(T.tax)}</span></div><div class="tot f"><span>Total</span><span>${m(T.t)}</span></div>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn p" onclick="bill(true)">Save and print bill</button><button class="btn" onclick="bill(false)">Save without printing</button><button class="btn" onclick="cart=[];xc=[];dpct=0;cust='';cph='';render()">Clear</button></div></div></div>`}
function resHTML(){
const k=q.trim().toLowerCase();const r=db.items.filter(i=>av(i)>0&&(!k||(i.name+' '+i.batch+' '+(i.bc||'')).toLowerCase().includes(k))).slice(0,30);
return r.length?r.map(i=>{const s=status(i);return `<div class="it" onclick="add('${i.id}')"><span>${esc(i.name)}<div class="sm">Batch ${esc(i.batch)} · Exp ${fe(i.exp)} · Stock ${stk(i)}${s[1]?` <span class="tag ${s[1]}">${s[0]}</span>`:''}</div></span><b>${m(i.price)}</b></div>`}).join(''):'<div class="empty">No matching medicine in stock.</div>'}
function res(){$('#res').innerHTML=resHTML()}
function addFirst(){const k=q.trim().toLowerCase();const bc=db.items.find(i=>i.bc&&i.bc.toLowerCase()==k);if(bc){if(av(bc)>0)return add(bc.id);return toast('Out of stock')}const i=db.items.find(i=>av(i)>0&&(i.name+' '+i.batch).toLowerCase().includes(k));if(i)add(i.id)}
function add(id){const it=db.items.find(i=>i.id==id);if(it.exp<ym())return toast('This batch has expired. It cannot be sold.');const u=(it.per||1)>1&&av(it)<it.per?'t':'s',c=cart.find(c=>c.id==id&&c.u==u);if(c)c.qty++;else cart.push({id,qty:1,u});if(need(id)>av(it)){toast('No more stock available');if(c)c.qty--;else cart.pop()}q='';render();const e=$('#q');e&&e.focus()}
function addX(){const a=parseFloat($('#x_a').value);if(!(a>0))return toast('Enter a charge amount above 0');xc.push({l:$('#x_l').value.trim()||'Additional charge',a:Math.round(a*100)/100});render()}
function setQty(i,v){const c=cart[i],it=db.items.find(x=>x.id==c.id);c.qty=Math.max(1,parseInt(v)||1);const ov=need(c.id)-av(it);if(ov>0){c.qty=Math.max(1,c.qty-Math.ceil(ov/(c.u=='t'?1:pr(it))));toast('Only '+stk(it)+' in stock')}render()}
function bill(print){
if(!cart.length)return toast('Add at least one item');
const T=totals(),lines=cart.map(c=>{const it=db.items.find(i=>i.id==c.id);return{n:it.name,b:it.batch,q:c.qty,p:lp(c,it),g:it.gst,u:c.u||'s',ul:fm(it).u}});
if(cart.some(c=>need(c.id)>av(db.items.find(i=>i.id==c.id))))return toast('Not enough stock for one of the items');cart.forEach(c=>{const it=db.items.find(i=>i.id==c.id);take(it,uq(c,it))});
const s={no:'B'+String(db.seq++).padStart(5,'0'),t:new Date().toISOString(),d:today(),cust:cust.trim(),pay,lines,gross:T.g,disc:T.d,x:T.x,xc:xc.slice(),total:T.t,tax:T.tax,dp:dpct,by:me?me.name:'',ph:cph.trim()};
db.sales.push(s);save();cart=[];xc=[];dpct=0;cust='';cph='';q='';render();toast('Bill '+s.no+' saved');
if(print)printBill(s)}
/* ---------- Thermal print ---------- */
function printBill(s){
const c=db.cfg,w=c.paper==58?'48mm':'72mm';
$('#pg').textContent=`@page{size:${c.paper}mm auto;margin:0}#rcpt{width:${w}}`;
const dt=new Date(s.t);
$('#rcpt').innerHTML=`<div class="c"><b style="font-size:15px">${esc(c.name)}</b>${c.addr?'<br>'+esc(c.addr):''}${c.phone?'<br>Ph: '+esc(c.phone):''}${c.gst?'<br>GSTIN: '+esc(c.gst):''}${c.dl?'<br>DL No: '+esc(c.dl):''}</div><hr>
<div>Bill: ${s.no}<br>${dt.toLocaleDateString('en-GB')} ${dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}${s.cust?'<br>Customer: '+esc(s.cust):''}</div><hr>
<table><tr><th>Item</th><th class="r">Qty</th><th class="r">Amt</th></tr>${s.lines.map(l=>`<tr><td colspan="3">${esc(l.n)}</td></tr><tr><td>&nbsp;&nbsp;${esc(l.b)} @ ${(+l.p).toFixed(2)}${l.u=='t'?'/'+(l.ul||'tab'):''}</td><td class="r">${l.q}${l.u=='t'?' '+(l.ul||'tab'):''}</td><td class="r">${(l.q*l.p).toFixed(2)}</td></tr>`).join('')}</table><hr>
<table><tr><td>Subtotal</td><td class="r">${s.gross.toFixed(2)}</td></tr>${s.disc>0?`<tr><td>Discount (${s.dp}%)</td><td class="r">-${s.disc.toFixed(2)}</td></tr>`:''}${(s.xc||[]).map(c=>`<tr><td>${esc(c.l)}</td><td class="r">${c.a.toFixed(2)}</td></tr>`).join('')}<tr><td><b>TOTAL</b></td><td class="r"><b>${c.cur}${s.total.toFixed(2)}</b></td></tr></table>
<div>Paid by: ${s.pay}<br>GST included: ${s.tax.toFixed(2)}</div><hr><div class="c">${esc(c.foot)}</div><div style="height:8mm"></div>`;
setTimeout(()=>window.print(),80)}
/* ---------- Inventory ---------- */
const isOwner=()=>!db.users.length||(me&&me.role=='owner');
const cap=s=>s[0].toUpperCase()+s.slice(1);
function fmChange(){const F=FORMS[$('#f_f').value];$('#lb_q').textContent=cap(F.pp)+' in stock (whole '+F.pp+')';$('#lb_p').textContent='Price per '+F.p+' (MRP)';$('#lb_pp').textContent=F.d+' (1 if not sold loose)'}
function logAdj(it,type,n,r){db.adj.push({t:new Date().toISOString(),d:today(),n:it.name,b:it.batch,type,q:n,ul:pr(it)>1?fm(it).us:fm(it).pp,v:Math.round(n*it.price/pr(it)*100)/100,r:r||'',by:me?me.name:''})}
function vInv(){
const ow=isOwner(),e=db.items.find(i=>i.id==editId)||{name:'',batch:'',exp:'',qty:'',price:'',gst:12,low:10,bc:'',per:1,form:'Tablet'},F=fm(e),li=db.items.find(i=>i.id==lossId);
const k=iq.trim().toLowerCase(),L=db.items.filter(i=>!k||(i.name+' '+i.batch).toLowerCase().includes(k)).sort((a,b)=>a.name.localeCompare(b.name));
const alerts=db.items.filter(i=>status(i)[1]).length;
return `${ow&&li?`<div class="card" style="margin-bottom:14px;border-color:var(--bad)"><h2>Record stock loss</h2><div class="sm" style="margin-bottom:8px">${esc(li.name)}, batch ${esc(li.batch)}. In stock: ${stk(li)}</div><div class="row"><div><label>Quantity lost</label><input id="ls_q" type="number" min="1"></div>${pr(li)>1?`<div><label>Unit</label><select id="ls_u"><option value="s">${fm(li).pp}</option><option value="t">${fm(li).us}</option></select></div>`:`<div class="sm" style="align-self:end">counted in ${fm(li).pp}</div>`}<div><label>Reason</label><select id="ls_r">${['Lost','Damaged','Broken','Spilled','Stolen','Other'].map(r=>`<option>${r}</option>`).join('')}</select></div></div><button class="btn p" onclick="doLoss()">Remove from stock</button> <button class="btn" onclick="lossId=null;render()">Cancel</button></div>`:''}
<div class="card" style="margin-bottom:14px"><h2>${editId?'Edit medicine':ow?'Add medicine':'Add medicine or add stock'}</h2>${ow?'':'<div class="sm" style="margin-bottom:8px">Staff can add new medicines and add more stock. If the medicine and batch already exist, the quantity is added to it. Changing expiry or price, removing stock and recording losses are owner only.</div>'}
<div class="row"><div style="grid-column:span 2"><label>Medicine name</label><input id="f_n" list="nl" value="${esc(e.name)}"><datalist id="nl">${[...new Set(db.items.map(i=>i.name))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div><div><label>Batch no.</label><input id="f_b" value="${esc(e.batch)}"></div><div><label>Expiry</label><input id="f_e" type="month" value="${e.exp}"></div></div>
<div class="row"><div><label>Type</label><select id="f_f" onchange="fmChange()">${Object.keys(FORMS).map(x=>`<option ${x==fmName(e)?'selected':''}>${x}</option>`).join('')}</select></div><div><label id="lb_q">${cap(F.pp)} in stock (whole ${F.pp})</label><input id="f_q" type="number" min="0" value="${e.qty}"></div><div><label id="lb_p">Price per ${F.p} (MRP)</label><input id="f_p" type="number" min="0" step="0.01" value="${e.price}"></div><div><label>GST %</label><input id="f_g" type="number" min="0" value="${e.gst}"></div><div><label>Low stock alert at</label><input id="f_l" type="number" min="0" value="${e.low}"></div><div><label id="lb_pp">${F.d} (1 if not sold loose)</label><input id="f_pp" type="number" min="1" value="${e.per||1}"></div><div><label>Barcode (optional)</label><input id="f_bc" value="${esc(e.bc)}"></div></div>
<button class="btn p" onclick="saveItem()">${editId?'Update medicine':'Add to inventory'}</button> ${editId?'<button class="btn" onclick="editId=null;render()">Cancel</button>':''}</div>
<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><h2 style="margin:0">Stock (${db.items.length} items${alerts?`, ${alerts} need attention`:''})</h2><input style="max-width:260px" placeholder="Search stock" value="${esc(iq)}" oninput="iq=this.value;render();const x=$('#app input[placeholder=\\'Search stock\\']');x.focus();x.setSelectionRange(99,99)"></div>

function addStock(id){const it=db.items.find(i=>i.id==id),v=parseInt($('#as_'+id).value),u=$('#au_'+id)?$('#au_'+id).value:'s';if(!it||!(v>0))return toast('Enter a quantity above 0');const n=u=='t'?v:v*pr(it);addU(it,n);logAdj(it,'add',n);save();render();toast('Stock added')}
function doLoss(){if(!isOwner())return;const it=db.items.find(i=>i.id==lossId),v=parseInt($('#ls_q').value),u=$('#ls_u')?$('#ls_u').value:'s';if(!it||!(v>0))return toast('Enter the quantity lost');const n=u=='t'?v:v*pr(it);if(n>av(it))return toast('You only have '+stk(it));take(it,n);logAdj(it,'loss',n,$('#ls_r').value);lossId=null;save();render();toast('Loss recorded, stock reduced')}
function saveItem(){
const ow=isOwner(),v=id=>$('#'+id).value,o={name:v('f_n').trim(),batch:v('f_b').trim(),exp:v('f_e'),form:v('f_f'),qty:parseInt(v('f_q')),price:parseFloat(v('f_p')),gst:parseFloat(v('f_g'))||0,low:parseInt(v('f_l'))||0,bc:v('f_bc').trim(),per:Math.max(1,parseInt(v('f_pp'))||1)};

if(editId){if(!ow)return toast('Only the owner can edit medicines');const it=db.items.find(i=>i.id==editId);Object.assign(it,o);if(o.per<=1)it.loose=0}
else{const ex=db.items.find(i=>i.name.toLowerCase()==o.name.toLowerCase()&&i.batch.toLowerCase()==o.batch.toLowerCase());
if(ex&&!ow){if(o.qty>0){addU(ex,o.qty*pr(ex));logAdj(ex,'add',o.qty*pr(ex))}msg='Batch already exists: stock added to it'}
else{const it={id:'i'+Date.now()+Math.random().toString(36).slice(2,6),...o};db.items.push(it);if(!ow&&o.qty>0)logAdj(it,'add',o.qty*o.per)}}
editId=null;save();render();toast(msg)}

/* ---------- Sales ---------- */
function vSales(){
const S=db.sales.filter(s=>s.d==sdate),ref=db.rets.filter(r=>r.d==sdate).reduce((a,r)=>a+r.amt,0),rev=S.reduce((a,s)=>a+s.total,0)-ref,units=S.reduce((a,s)=>a+s.lines.reduce((b,l)=>b+l.q,0),0);
const pm={};S.forEach(s=>pm[s.pay]=(pm[s.pay]||0)+s.total);db.rets.filter(r=>r.d==sdate).forEach(r=>pm[r.pay]=(pm[r.pay]||0)-r.amt);
const top={};S.forEach(s=>s.lines.forEach(l=>{top[l.n]=top[l.n]||{q:0,a:0};top[l.n].q+=l.q;top[l.n].a+=l.q*l.p*(1-s.dp/100)}));
const tl=Object.entries(top).sort((a,b)=>b[1].q-a[1].q).slice(0,5);
const days=[...Array(7)].map((_,i)=>{const d=new Date(sdate+'T00:00');d.setDate(d.getDate()-6+i);const k=d.toLocaleDateString('en-CA');return{k,l:d.toLocaleDateString('en-GB',{weekday:'short'}),v:db.sales.filter(s=>s.d==k).reduce((a,s)=>a+s.total,0)-db.rets.filter(r=>r.d==k).reduce((a,r)=>a+r.amt,0)}});
const mx=Math.max(...days.map(d=>d.v),1);
return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px"><label style="margin:0">Date</label><input type="date" style="max-width:170px" value="${sdate}" onchange="sdate=this.value||today();render()"></div>
<div class="grid g3" style="margin-bottom:14px"><div class="card"><div class="sm">Sales after refunds</div><div class="big">${m(rev)}</div>${ref?`<div class="sm">${m(ref)} refunded</div>`:''}</div><div class="card"><div class="sm">Bills</div><div class="big">${S.length}</div><div class="sm">${units} units sold${S.length?`, average bill ${m(rev/S.length)}`:''}</div></div><div class="card"><div class="sm">Payment mode</div>${Object.keys(pm).length?Object.entries(pm).map(([k,v])=>`<div class="tot"><span>${k}</span><b>${m(v)}</b></div>`).join(''):'<div class="sm">No sales on this date</div>'}</div></div>
<div class="grid g2" style="margin-bottom:14px"><div class="card"><h2>Last 7 days</h2><div class="bars">${days.map(d=>`<div class="bar"><span>${d.v?Math.round(d.v):''}</span><i style="height:${d.v/mx*80}%"></i><span>${d.l}</span></div>`).join('')}</div></div>
<div class="card"><h2>Best sellers</h2>${tl.length?`<table>${tl.map(([n,x])=>`<tr><td>${esc(n)}</td><td class="n">${x.q} sold</td><td class="n">${m(x.a)}</td></tr>`).join('')}</table>`:'<div class="empty">Nothing sold on this date.</div>'}</div></div>
<div class="card"><h2>Bills</h2><div class="tw">${S.length?`<table><tr><th>Bill</th><th>Time</th><th>Customer</th><th>Payment</th><th class="n">Total</th><th></th></tr>${S.slice().reverse().map(s=>`<tr><td>${s.no}</td><td>${new Date(s.t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</td><td>${esc(s.cust)||'–'}</td><td>${s.pay}</td><td class="n">${m(s.total)}</td><td><button class="btn s" onclick="printBill(db.sales.find(x=>x.no=='${s.no}'))">Reprint</button></td></tr>`).join('')}</table>`:'<div class="empty">No bills on this date.</div>'}</div></div>${vExp()}`}
/* ---------- Loose tablets ---------- */
const pr=i=>i.per||1,av=i=>i.qty*pr(i)+(i.loose||0);
const FORMS={Tablet:{p:'strip',pp:'strips',u:'tab',us:'tabs',d:'Tablets per strip'},Capsule:{p:'strip',pp:'strips',u:'tab',us:'tabs',d:'Tablets per strip'},Syrup:{p:'bottle',pp:'bottles',u:'ml',us:'ml',d:'ML per bottle'},Drops:{p:'bottle',pp:'bottles',u:'ml',us:'ml',d:'ML per bottle'},Injection:{p:'box',pp:'boxes',u:'amp',us:'amps',d:'Ampoules per box'},Ointment:{p:'tube',pp:'tubes',u:'g',us:'g',d:'Grams per tube'},Sachet:{p:'box',pp:'boxes',u:'sachet',us:'sachets',d:'Sachets per box'},Other:{p:'pack',pp:'packs',u:'unit',us:'units',d:'Units per pack'}};
const fmName=i=>FORMS[i.form]?i.form:(pr(i)>1?'Tablet':'Other'),fm=i=>FORMS[fmName(i)];

const stk=i=>pr(i)>1?i.qty+' '+fm(i).pp+(i.loose?' + '+i.loose+' '+fm(i).us:''):String(i.qty);
const tp=it=>db.cfg.rup!==false&&fm(it).u=='tab'?Math.ceil(it.price/pr(it)-1e-9):it.price/pr(it),lp=(c,it)=>c.u=='t'?tp(it):it.price,la=(c,it)=>Math.round(c.qty*lp(c,it)*100)/100,uq=(c,it)=>c.u=='t'?c.qty:c.qty*pr(it);
const need=id=>{const it=db.items.find(i=>i.id==id);return cart.filter(c=>c.id==id).reduce((a,c)=>a+uq(c,it),0)};
function take(it,n){const t=av(it)-n;it.qty=Math.floor(t/pr(it));it.loose=t%pr(it)}
function addU(it,n){const t=av(it)+n;it.qty=Math.floor(t/pr(it));it.loose=t%pr(it)}
function setUnit(i,u){cart[i].u=u;cart[i].qty=1;if(need(cart[i].id)>av(db.items.find(x=>x.id==cart[i].id))){cart.splice(i,1);toast('Not enough stock')}render()}
/* ---------- Customers ---------- */

function vRep(){const lim=new Date();lim.setDate(lim.getDate()+90);const ls=lim.toLocaleDateString('en-CA').slice(0,7),now=ym();

return `<div class="grid g3" style="margin-bottom:14px"><div class="card"><div class="sm">Usable stock value (at MRP)</div><div class="big">${m(val(db.items.filter(i=>i.exp>=now)))}</div></div><div class="card"><div class="sm">Expired stock value</div><div class="big">${m(val(ex))}</div><div class="sm">${ex.length} batches to remove</div></div><div class="card"><div class="sm">Expiring within 90 days</div><div class="big">${so.length}</div><div class="sm">batches, worth ${m(val(so))}</div></div></div>

function doRet(print){const s=db.sales.find(x=>x.no==rq);if(!s)return;const d=retDone(s.no),L=[];
s.lines.forEach((l,i)=>{const e=$('#r_'+i),q=Math.min(parseInt(e&&e.value)||0,l.q-(d[l.n+'|'+l.b+'|'+(l.u||'s')]||0));if(q>0)L.push({n:l.n,b:l.b,q,p:l.p,u:l.u||'s',ul:l.ul})});
if(!L.length)return toast('Enter a return quantity');
L.forEach(l=>{const it=db.items.find(i=>i.name==l.n&&i.batch==l.b);if(it)addU(it,l.u=='t'?l.q:l.q*pr(it))});
const r={no:'R'+String(db.rseq=(db.rseq||0)+1).padStart(5,'0'),sale:s.no,t:new Date().toISOString(),d:today(),lines:L,amt:Math.round(L.reduce((a,l)=>a+l.q*l.p,0)*(1-s.dp/100)*100)/100,pay:s.pay,by:me?me.name:''};

function printSlip(r){const c=db.cfg;$('#pg').textContent=`@page{size:${c.paper}mm auto;margin:0}#rcpt{width:${c.paper==58?'48mm':'72mm'}}`;const dt=new Date(r.t);

async function impFile(f){if(!f)return;try{const n=f.name.toLowerCase();let R;if(n.endsWith('.xlsx'))R=await readXlsx(await f.arrayBuffer());else if(n.endsWith('.csv')||n.endsWith('.txt'))R=parseCsv(await f.text());else throw 'Choose an .xlsx or .csv file';imp=parseImport(R);if(!imp.ok.length&&!imp.bad.length)throw 'No rows found in that file';render()}catch(e){imp=null;toast(String(e))}}
function impTpl(){dl('stock-import-template.xlsx',xlsxBlob([['Medicine','Type','Batch','Expiry','Packs','Loose units','MRP per pack','GST %','Low alert','Units per pack','Barcode'],['Paracetamol 500 mg (strip of 10)','Tablet','PC2301','08/2027',10,0,22,12,20,10,'']]))}
const sameIt=r=>db.items.find(i=>i.name.toLowerCase()==r.name.toLowerCase()&&i.batch.toLowerCase()==r.batch.toLowerCase());
function doImport(){if(!isOwner()||!imp)return;let a=0,nw=0;imp.ok.forEach(r=>{let it=sameIt(r);if(it)a++;else{it={id:'i'+Date.now()+Math.random().toString(36).slice(2,6),name:r.name,batch:r.batch,exp:r.exp,form:r.form,qty:0,loose:0,price:r.price,gst:r.gst,low:r.low,bc:r.bc,per:r.per};db.items.push(it);nw++}
const n=r.qty*pr(it)+(pr(it)>1?r.loose:0);if(n>0){addU(it,n);logAdj(it,'add',n,'Import')}});imp=null;save();render();toast(nw+' new, '+a+' existing updated')}
function vInvImp(){const nA=imp?imp.ok.filter(sameIt).length:0;
return `<div class="card" style="margin-top:14px"><h2>Import stock from Excel or CSV</h2><p class="sm" style="margin-top:0">Use the same columns as the export, or download the template. Required: Medicine, Batch, Expiry, Packs, MRP per pack. A row that matches an existing medicine and batch adds to its stock. Nothing is ever removed.</p><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label class="btn p" style="display:inline-block;margin:0;font-size:15px;cursor:pointer">Choose file (.xlsx or .csv)<input type="file" accept=".xlsx,.csv,.txt" style="display:none" onchange="impFile(this.files[0])"></label><button class="btn" onclick="impTpl()">Download template</button></div>${imp?`<div style="margin-top:12px"><b>${imp.ok.length} rows ready</b> (${imp.ok.length-nA} new, ${nA} add to existing stock)${imp.bad.length?`<div class="sm">${imp.bad.length} skipped: ${esc(imp.bad.slice(0,5).join('; '))}${imp.bad.length>5?'...':''}</div>`:''}<div style="display:flex;gap:8px;margin-top:8px">${imp.ok.length?'<button class="btn p" onclick="doImport()">Import now</button>':''}<button class="btn" onclick="imp=null;render()">Cancel</button></div></div>`:''}</div>`}
/* ---------- Storage choice: this device or Google Drive ---------- */
let gtok='',gexp=0,gmsg='',gtm=null;const GU='https://www.googleapis.com/';
function gsi(){return new Promise((ok,no)=>{if(window.google&&google.accounts)return ok();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=()=>no('Could not reach Google. Check your internet');document.head.appendChild(s)})}
async function gTok(silent){if(gtok&&Date.now()<gexp)return gtok;const id=(db.cfg.gcid||'').trim();if(!id)throw 'Enter your Google Client ID first';await gsi();return new Promise((ok,no)=>google.accounts.oauth2.initTokenClient({client_id:id,scope:GU+'auth/drive.appdata',callback:r=>{if(r.error)return no(r.error);gtok=r.access_token;gexp=Date.now()+(r.expires_in-60)*1000;ok(gtok)},error_callback:e=>no((e&&e.type)||'Google sign-in was cancelled')}).requestAccessToken({prompt:silent?'none':''}))}
async function gFile(t){const r=await fetch(GU+'drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='pharmacy-data.json'"),{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw 'Google Drive refused the request ('+r.status+'). Is the Drive API enabled?';return (await r.json()).files[0]}
async function gPush(silent){const t=await gTok(silent),f=await gFile(t),b='pb'+Date.now(),meta=f?{name:'pharmacy-data.json'}:{name:'pharmacy-data.json',parents:['appDataFolder']};
const r=await fetch(GU+'upload/drive/v3/files'+(f?'/'+f.id:'')+'?uploadType=multipart',{method:f?'PATCH':'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(db)}\r\n--${b}--`});if(!r.ok)throw 'Upload failed ('+r.status+')';gmsg='Last synced '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
async function gPull(){const t=await gTok(),f=await gFile(t);if(!f)throw 'No copy in Google Drive yet';const r=await fetch(GU+'drive/v3/files/'+f.id+'?alt=media',{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw 'Download failed';return r.json()}
function cloudQ(){if(db.cfg.store!='cloud'||!db.cfg.gon)return;clearTimeout(gtm);gtm=setTimeout(()=>gPush(true).then(()=>{const e=$('#gst');if(e)e.textContent=gmsg}).catch(e=>{gmsg='Saved on this device only. Open Settings and tap Sync now ('+e+')';const x=$('#gst');if(x)x.textContent=gmsg}),3000)}
async function gSync(){try{toast('Connecting to Google...');await gPush();db.cfg.gon=true;try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}render();toast('Synced to Google Drive')}catch(e){gmsg=String(e);render();toast(gmsg)}}
async function gRestore(){try{const d=await gPull();if(!d.items||!d.sales||!d.cfg)throw 'The Google Drive copy is not valid';if(!confirm('Replace all data on this device with the Google Drive copy?'))return;db=d;db.users=db.users||[];db.purch=db.purch||[];db.rets=db.rets||[];db.adj=db.adj||[];me=null;save();render();toast('Restored from Google Drive')}catch(e){toast(String(e))}}
function dlBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='pharmacy-backup-'+today()+'.json';a.click()}
function loadFile(f){if(f)f.text().then(t=>{$('#bk').value=t;restore()})}
function vStore(){const c=db.cfg,cl=c.store=='cloud';return `<div class="card" style="margin-bottom:14px"><h2>Where to keep your data</h2><div class="row"><div><label>Storage</label><select onchange="db.cfg.store=this.value;save();render()"><option value="device" ${cl?'':'selected'}>This device only</option><option value="cloud" ${cl?'selected':''}>This device + Google Drive</option></select></div></div>
<p class="sm" style="margin-top:0">${cl?'Every change is saved on this device first, then copied to a private app folder in your Google Drive. Billing still works if the internet drops. If two devices edit at once, the last upload wins.':'Everything stays in this browser on this device. Use the file backup below to move it elsewhere.'}</p>
${cl?`<div class="row"><div style="grid-column:span 2"><label>Google OAuth Client ID</label><input value="${esc(c.gcid||'')}" placeholder="1234-abc.apps.googleusercontent.com" onchange="db.cfg.gcid=this.value.trim();save()"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" onclick="gSync()">Sign in and sync now</button><button class="btn" onclick="gRestore()">Restore from Google Drive</button></div><div class="sm" id="gst" style="margin-top:8px">${esc(gmsg)}</div><details class="sm" style="margin-top:8px"><summary>How to get a Client ID (one time)</summary><ol><li>Open console.cloud.google.com and create a project.</li><li>APIs &amp; Services: enable <b>Google Drive API</b>. On the OAuth consent screen, add your Google account as a test user.</li><li>Credentials: create an <b>OAuth client ID</b> of type Web application. Under Authorised JavaScript origins add the address where you open this page.</li><li>That address must start with https:// (or be http://localhost). Google blocks pages opened by double-clicking the file.</li><li>Paste the Client ID above and tap Sign in.</li></ol></details>`:''}</div>`}
render();
